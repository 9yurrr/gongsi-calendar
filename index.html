<title>공시 일정 달력</title>
<style>
:root{--bg:#fff;--fg:#111;--sub:#6b6b6b;--line:#e4e4e4;--soft:#f6f6f6;--sel:#111;--selfg:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141414;--fg:#eee;--sub:#9a9a9a;--line:#2c2c2c;--soft:#1d1d1d;--sel:#eee;--selfg:#111}}
:root[data-theme="dark"]{--bg:#141414;--fg:#eee;--sub:#9a9a9a;--line:#2c2c2c;--soft:#1d1d1d;--sel:#eee;--selfg:#111}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,"Pretendard","Malgun Gothic",sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:20px;margin:0}
.upd{color:var(--sub);font-size:13px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0 10px;flex-wrap:wrap}
.nav{display:flex;align-items:center;gap:6px}
.nav button{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px;width:34px;height:34px;font-size:16px;cursor:pointer}
.month{font-size:18px;font-weight:600;min-width:120px;text-align:center}
.tabs{display:flex;gap:16px}
.tabs button{border:0;background:none;color:var(--sub);font-size:14px;padding:4px 0;cursor:pointer;border-bottom:2px solid transparent}
.tabs button.on{color:var(--fg);border-bottom-color:var(--fg);font-weight:600}
.main{display:grid;grid-template-columns:1fr 320px;gap:20px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}
.wd{font-size:12px;color:var(--sub);text-align:center;padding:6px 0;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.day{min-height:92px;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer;background:var(--bg);text-align:left;font:inherit;color:inherit;border-top:0;border-left:0}
.day:hover{background:var(--soft)}
.day.out{color:var(--sub);opacity:.45}
.day .n{font-size:13px;font-weight:600}
.day.today .n{text-decoration:underline;text-underline-offset:3px}
.day.sel{background:var(--sel);color:var(--selfg)}
.day.sel .ev,.day.sel .more{color:var(--selfg)}
.ev{font-size:11.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.more{font-size:11px;color:var(--sub);margin-top:2px}
.cnt{display:none;font-size:12px;color:var(--sub);margin-top:4px}
aside{border:1px solid var(--line);border-radius:8px;padding:16px;align-self:start;position:sticky;top:16px}
aside h2{font-size:16px;margin:0 0 12px}
.item{padding:10px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0;padding-top:0}
.cat{font-size:12px;color:var(--sub)}
.tt{font-weight:600}
.ss{font-size:13px;color:var(--sub)}
.item a{color:inherit;font-size:13px}
.empty{color:var(--sub);font-size:14px}
.note{color:var(--sub);font-size:12px;margin-top:24px}
@media (max-width:760px){
  .main{grid-template-columns:1fr}
  aside{position:static}
  .day{min-height:56px;padding:4px}
  .ev,.more{display:none}
  .cnt{display:block}
}
</style>
</head>

const CATS = ["전체", "경제지표", "미국 실적", "한국 실적", "국내 공시", "이슈"];
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayIso = iso(new Date());
let cat = "전체", sel = todayIso, view = new Date();
view.setDate(1);

const byDay = () => {
  const m = {};
  for (const e of EV) if (cat === "전체" || e.c === cat) (m[e.d] = m[e.d] || []).push(e);
  const ord = c => { const i = CATS.indexOf(c); return i < 0 ? 99 : i; };
  for (const k in m) m[k].sort((a, b) => ord(a.c) - ord(b.c) || (b.r || 0) - (a.r || 0));
  return m;
};

function renderTabs() {
  const t = document.getElementById("tabs");
  t.innerHTML = "";
  for (const c of CATS) {
    const b = document.createElement("button");
    b.textContent = c;
    b.className = c === cat ? "on" : "";
    b.onclick = () => { cat = c; render(); };
    t.appendChild(b);
  }
}

function renderGrid() {
  const m = byDay();
  document.getElementById("month").textContent = `${view.getFullYear()}년 ${view.getMonth() + 1}월`;
  const g = document.getElementById("grid");
  g.innerHTML = "";
  for (const w of "일월화수목금토") {
    const h = document.createElement("div");
    h.className = "wd"; h.textContent = w; g.appendChild(h);
  }
  const start = new Date(view); start.setDate(1 - view.getDay());
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const k = iso(d), list = m[k] || [];
    const cell = document.createElement("button");
    cell.className = "day" + (d.getMonth() !== view.getMonth() ? " out" : "") + (k === todayIso ? " today" : "") + (k === sel ? " sel" : "");
    cell.innerHTML = `<div class="n">${d.getDate()}</div>`
      + list.slice(0, 3).map(e => `<div class="ev">${esc(e.t)}</div>`).join("")
      + (list.length > 3 ? `<div class="more">+${list.length - 3}</div>` : "")
      + (list.length ? `<div class="cnt">${list.length}건</div>` : "");
    cell.onclick = () => { sel = k; render(); };
    g.appendChild(cell);
  }
}

function renderSide() {
  const list = byDay()[sel] || [];
  const d = new Date(sel + "T00:00:00");
  const s = document.getElementById("side");
  s.innerHTML = `<h2>${d.getMonth() + 1}월 ${d.getDate()}일 (${"일월화수목금토"[d.getDay()]})</h2>`
    + (list.length ? list.map(e => `<div class="item"><div class="cat">${esc(e.c)}</div><div class="tt">${esc(e.t)}</div><div class="ss">${esc(e.s)}</div>${e.u ? `<a href="${e.u}" target="_blank" rel="noopener">원문 보기</a>` : ""}</div>`).join("")
      : `<div class="empty">이 날은 일정이 없어요.</div>`);
}

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function render() { renderTabs(); renderGrid(); renderSide(); }
document.getElementById("prev").onclick = () => { view.setMonth(view.getMonth() - 1); render(); };
document.getElementById("next").onclick = () => { view.setMonth(view.getMonth() + 1); render(); };
render();
</script>
